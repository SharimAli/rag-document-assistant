<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>RAG Document Assistant</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; background: #fafafa; }
  h1 { font-size: 1.4rem; }
  #chat { border: 1px solid #ddd; border-radius: 8px; padding: 16px; min-height: 200px; background: white; margin-bottom: 12px; }
  .msg { margin-bottom: 14px; }
  .msg .who { font-weight: 600; font-size: 0.85rem; color: #555; }
  .sources { font-size: 0.8rem; color: #888; margin-top: 4px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #ccc; }
  button { padding: 10px 16px; border-radius: 6px; border: none; background: #2563eb; color: white; cursor: pointer; }
  button:disabled { background: #999; }
</style>
</head>
<body>
  <h1>RAG Document Assistant</h1>
  <p style="color:#666; font-size: 0.9rem;">Ask a question about the documents you indexed with <code>python -m app.ingest</code>.</p>

  <div id="chat"></div>

  <form id="form">
    <input id="question" type="text" placeholder="Ask something about your documents..." autocomplete="off" />
    <button type="submit" id="submitBtn">Ask</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("question");
    const chat = document.getElementById("chat");
    const submitBtn = document.getElementById("submitBtn");

    function addMessage(who, text, sources) {
      const div = document.createElement("div");
      div.className = "msg";
      let html = `<div class="who">${who}</div><div>${text}</div>`;
      if (sources && sources.length) {
        html += `<div class="sources">Sources: ${sources.join(", ")}</div>`;
      }
      div.innerHTML = html;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addMessage("You", question);
      input.value = "";
      submitBtn.disabled = true;
      addMessage("Assistant", "Thinking...");

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();

        chat.lastChild.remove(); // remove "Thinking..."
        addMessage("Assistant", data.answer, data.sources);
      } catch (err) {
        chat.lastChild.remove();
        addMessage("Assistant", "Error reaching the server. Is it running?");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
